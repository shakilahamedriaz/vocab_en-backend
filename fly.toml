[app]
name = "ielts-vocab-backend"
primary_region = "sin"

[build]

[env]
  APP_NAME = "IELTS Vocab Platform"
  APP_VERSION = "1.0.0"
  DEBUG = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
